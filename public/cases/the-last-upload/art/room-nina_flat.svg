<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
  <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#f6c77d" stop-opacity=".55"/>
    <stop offset="1" stop-color="#f6c77d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cold" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#8fb3d9" stop-opacity=".35"/>
    <stop offset="1" stop-color="#8fb3d9" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000" stop-opacity=".35"/>
    <stop offset=".5" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".45"/>
  </linearGradient>
</defs>
<rect width="400" height="200" fill="#382a2c"/>
<rect y="200" width="400" height="100" fill="#1f1617"/>
<line x1="0" y1="200" x2="400" y2="200" stroke="#000" stroke-opacity=".4" stroke-width="2"/>

<g>
  <rect x="26" y="31" width="68" height="63" fill="#18161c"/>
  <rect x="30" y="35" width="60" height="55" fill="#20151a"/>
  <circle cx="75.0" cy="51.5" r="6" fill="#d9dde8" opacity=".7"/>
  <line x1="60.0" y1="35" x2="60.0" y2="90" stroke="#18161c" stroke-width="3"/>
  <line x1="30" y1="62.5" x2="90" y2="62.5" stroke="#18161c" stroke-width="3"/>
</g>
<!-- wardrobe open, left -->
<rect x="0" y="100" width="70" height="140" fill="#3a2a2a"/>
<rect x="5" y="105" width="60" height="130" fill="#140e10"/>
<line x1="8" y1="115" x2="62" y2="115" stroke="#777" stroke-width="2"/>
<path d="M18 115 l-6 8 h12 z M40 115 l-6 8 h12 z" fill="none" stroke="#999" stroke-width="1.2"/>
<rect x="30" y="123" width="18" height="40" fill="#5a3b52"/>
<path d="M70 100 L96 92 L96 248 L70 240 Z" fill="#4a3434"/>
<!-- counter with tablet (h_ntablet 220,144) and sink with receipt (h_receipt 152,180) -->
<rect x="110" y="150" width="200" height="10" fill="#8f8a86"/>
<rect x="110" y="160" width="200" height="110" fill="#3f2f2f"/>
<g stroke="#2b2020" stroke-width="2"><line x1="176" y1="165" x2="176" y2="270"/><line x1="242" y1="165" x2="242" y2="270"/></g>
<!-- open drawer -->
<rect x="246" y="168" width="60" height="20" fill="#4f3b3b"/><rect x="250" y="188" width="60" height="10" fill="#2b2020"/>
<rect x="130" y="151" width="50" height="9" rx="2" fill="#5e5a58"/>
<rect x="133" y="153" width="44" height="6" fill="#262222"/>
<path d="M144 156 q8 -10 14 -2 q4 6 10 -2" fill="none" stroke="#9a9a9a" stroke-width="2" opacity=".5"/>
<path d="M146 162 q-3 10 6 16 q8 5 10 -4 q2 -8 -4 -10 z" fill="#efe6d6" transform="translate(0 -4)"/>
<path d="M146 166 q4 4 2 10 l6 2 q4 -6 -2 -10 z" fill="#2a1a12" transform="translate(0 -4)"/>
<rect x="208" y="140" width="26" height="10" rx="2" fill="#111" transform="rotate(-4 221 145)"/>
<rect x="210" y="141" width="22" height="7" fill="#6b2f3f" transform="rotate(-4 221 145)"/>
<path d="M232 150 q10 6 20 0" fill="none" stroke="#222" stroke-width="1.5"/>
<!-- fridge with card (h_card 288,90) -->
<rect x="260" y="40" width="70" height="110" rx="5" fill="#bdb8b2"/>
<rect x="276" y="76" width="26" height="22" fill="#f0d6dc" transform="rotate(-5 289 87)"/>
<text x="289" y="89" font-size="5" font-family="Georgia" fill="#8a2f45" text-anchor="middle" transform="rotate(-5 289 87)">Happy b-day</text>
<!-- suitcase gone: dust outline -->
<rect x="330" y="215" width="50" height="30" fill="none" stroke="#6b5a5a" stroke-dasharray="3 3"/>
<!-- papers on floor -->
<rect x="140" y="275" width="22" height="14" fill="#d9d2c4" transform="rotate(12 151 282)"/><rect x="200" y="280" width="18" height="12" fill="#d9d2c4" transform="rotate(-18 209 286)"/>
<ellipse cx="360" cy="80" rx="60" ry="50" fill="url(#lamp)" opacity=".6"/>

<rect width="400" height="300" fill="url(#vignette)"/>
</svg>
