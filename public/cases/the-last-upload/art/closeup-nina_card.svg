<defs>
  <radialGradient id="spot" cx="50%" cy="45%" r="65%">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#000" stop-opacity=".45"/>
  </radialGradient>
</defs><rect width="400" height="300" fill="#3b2f27"/>

<rect width="400" height="300" fill="#bdb8b2"/>
