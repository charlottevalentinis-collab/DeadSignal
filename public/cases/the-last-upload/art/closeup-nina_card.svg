<text x="200" y="140" font-size="18" font-family="Georgia" font-weight="normal" fill="#4a2a33" text-anchor="middle" >3rd of September</text>
<text x="200" y="190" font-size="14" font-family="Georgia" font-weight="normal" fill="#4a2a33" text-anchor="middle" font-style="italic">The office won't run</text>
